<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="Rea Amparo developer profile banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B18"/>
      <stop offset="0.52" stop-color="#081A33"/>
      <stop offset="1" stop-color="#063B78"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.1" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#00C2FF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.9" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#0A5BFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0A5BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#5AA7FF" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="28" fill="url(#grid)"/>
  <rect width="1600" height="420" rx="28" fill="url(#orb1)"/>
  <rect width="1600" height="420" rx="28" fill="url(#orb2)"/>

  <g opacity="0.75" fill="none" stroke="#35C9FF" stroke-width="2">
    <path d="M1030 72h120v58h90"/>
    <path d="M1170 310h120v-64h170"/>
    <path d="M1315 90h70v84h145"/>
    <path d="M1040 260h68v-70h130"/>
  </g>

  <g fill="#63D8FF" filter="url(#glow)">
    <circle cx="1150" cy="72" r="4"/>
    <circle cx="1240" cy="130" r="4"/>
    <circle cx="1290" cy="310" r="4"/>
    <circle cx="1385" cy="90" r="4"/>
    <circle cx="1108" cy="190" r="4"/>
  </g>

  <g opacity="0.16" fill="#FFFFFF">
    <circle cx="1460" cy="200" r="110"/>
    <circle cx="1240" cy="110" r="60"/>
  </g>

  <text x="110" y="155" fill="#8EDFFF" font-family="monospace" font-size="22" letter-spacing="3">$ whoami</text>
  <text x="110" y="225" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700">REA AMPARO</text>
  <text x="114" y="270" fill="#B6D7FF" font-family="Arial, Helvetica, sans-serif" font-size="25">COMPUTER SCIENCE • SOFTWARE DEVELOPMENT</text>
  <text x="114" y="317" fill="#7EDCFF" font-family="monospace" font-size="20">mobile systems  /  backend  /  computer vision</text>

  <g transform="translate(110,345)">
    <rect width="260" height="34" rx="17" fill="#0A5BFF" fill-opacity="0.22" stroke="#2EA8FF" stroke-opacity="0.7"/>
    <circle cx="19" cy="17" r="5" fill="#32D6FF"/>
    <text x="34" y="23" fill="#D9F6FF" font-family="monospace" font-size="14">build • test • improve</text>
  </g>
</svg>